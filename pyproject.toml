[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "work-copilot"
version = "0.1.0"
description = "Local-first evidence-backed work context and attention companion"
requires-python = ">=3.11"
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0", "mcp==1.30.0", "filelock==3.32.7", "tzdata==2026.5"]

[project.optional-dependencies]
oauth-keyring = ["keyring>=25,<26"]
test = ["pytest>=8,<9", "httpx>=0.27,<1", "pytest-asyncio>=0.24,<2"]

[project.scripts]
work-copilot = "work_copilot.cli:main"

[tool.setuptools.package-data]
work_copilot = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
