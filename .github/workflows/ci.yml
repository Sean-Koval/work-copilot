# Runs the test suite and the fictional-data smoke check on each OS a work laptop might use.
# docs/LOCAL_READINESS.md lists macOS and Windows as unverified; this job is the first evidence for them.
# It never uses real work data, a company server or a model.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the pinned test set
        run: python -m pip install -c constraints.txt -e ".[test]"
      - name: Tests
        run: python -m pytest -q
      - name: Smoke through the POSIX launcher
        if: runner.os != 'Windows'
        run: ./run.sh smoke
      - name: Smoke through the PowerShell launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./run.ps1 smoke
      - name: Install the built wheel outside the checkout and smoke it
        # The coworker route (KAN-397): a non-editable install with no clone. Catches missing package data.
        shell: pwsh
        run: |
          $wheels = Join-Path $env:RUNNER_TEMP 'wheels'
          $venv = Join-Path $env:RUNNER_TEMP 'wheel-venv'
          python -m pip wheel . --no-deps -w $wheels
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m venv $venv
          $bin = if ($IsWindows) { Join-Path $venv 'Scripts' } else { Join-Path $venv 'bin' }
          $ext = if ($IsWindows) { '.exe' } else { '' }
          $py = Join-Path $bin "python$ext"
          $cli = Join-Path $bin "work-copilot$ext"
          & $py -m pip install -c constraints.txt (Get-ChildItem $wheels -Filter *.whl).FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location $env:RUNNER_TEMP
          & $cli --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $cli smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -c "import pathlib, work_copilot; p = pathlib.Path(work_copilot.__file__).parent; assert 'site-packages' in p.parts, p; assert (p / 'static' / 'index.html').is_file()"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  oauth-keychain:
    # OAuth tokens live only in the OS keychain (KAN-461). macOS and Windows use the real Keychain and
    # Credential Manager; Linux has no Secret Service on the runner and must refuse without a file fallback.
    name: OAuth keychain / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            keychain: required
          - os: windows-latest
            keychain: required
          - os: ubuntu-latest
            keychain: absent
    env:
      WORK_COPILOT_OS_KEYCHAIN: ${{ matrix.keychain }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with the keychain extra
        run: python -m pip install -c constraints.txt -e ".[test,oauth-keyring]"
      - name: OAuth storage tests
        run: python -m pytest -q tests/test_os_keychain.py tests/test_remote_mcp.py tests/test_doctor.py
